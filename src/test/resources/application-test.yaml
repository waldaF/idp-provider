auth:
  frontend:
    enabled: true

spring:
  application:
    name: idp-provider-test
  flyway:
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 120000
      max-lifetime: 1800000
      connection-timeout: 10000
      keepalive-time: 60000
  jpa:
    open-in-view: false
  configuration:
    urls: "http://localhost:5173"

google:
  configuration:
    client-id: "some-long-fake-token1213457678794784.apps.googleusercontent.com"
    allowed-domains: "test.com"

jwt:
  issuer: "test-idp-provider"
  frontend:
    audience:
      - "target-service"
    access[0]:
      unit: "MINUTES"
      expiration: 30
      key-id: "test-access-v1"
      private-key-pem: ""
      public-key-pem: ""
      cookie:
        name: "access_token"
        http-only: true
        secure: true
        domain:
        path: "/"
        same-site: "Strict"
    refresh[0]:
      unit: "DAYS"
      expiration: 10
      key-id: "test-refresh-v1"
      private-key-pem: ""
      public-key-pem: ""
      cookie:
        name: "refresh_token"
        http-only: true
        secure: false
        domain:
        path: "/api/v1/auth/frontend/refresh"
        same-site: "Strict"

  services:
    backend-service:
      audience:
        - "example-service"
      roles:
        - "READ"
      client-secret-hash: "$argon2id$v=19$m=24576,t=1,p=1$f376TCgRSWPnDyNnmzVG7w$P/O3Vj+D/dgxpo9RpbAjC79CSOwSJYRiiS+hVozfjJ4"
      access[0]:
        unit: "HOURS"
        expiration: 1
        key-id: "backend-service-v1"
        private-key-pem: ""
        public-key-pem: ""